<!doctype html><html lang='es'><meta charset='utf-8'><meta name='viewport' content='width=device-width, initial-scale=1'><meta name='theme-color' content='#087e83'><title>Tenerife 2026</title><style>*{box-sizing:border-box}body{margin:0;font:17px system-ui;background:#f5f4ed;color:#123e43}header{padding:40px 24px;background:linear-gradient(130deg,#07566d,#099b91);color:white;border-radius:0 0 30px 30px}h1{font-size:40px;margin:8px 0}main{padding:20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:850px;margin:auto}button{border:0;background:white;border-radius:18px;padding:24px 12px;text-align:left;font:inherit;color:inherit;font-weight:700;min-height:90px}section{padding:24px;background:white;border-radius:18px;margin:20px}small{display:block;padding:20px;text-align:center}</style><header>GUÍA DE VIAJE<h1>Tenerife 2026</h1>Descubre la isla</header><main id='menu'></main><section id='detail' hidden></section><small>Versión 1.2 · Base de publicación</small><script>const names=['Itinerario','Vuelos y reservas','Qué visitar','Guachinches y restaurantes','Gastronomía','Playas','Navidad','Aparcamientos','Meteorología','Gastos','Favoritos','Diario','Información útil'];const menu=document.getElementById('menu'),detail=document.getElementById('detail');for(const name of names){const b=document.createElement('button');b.textContent=name;b.onclick=()=>{menu.hidden=true;menu.style.display='none';detail.hidden=false;detail.replaceChildren();const back=document.createElement('button');back.textContent='← Inicio';back.onclick=()=>{detail.hidden=true;menu.hidden=false;menu.style.display='grid'};const h=document.createElement('h2');h.textContent=name;const p=document.createElement('p');p.textContent='Sección pendiente de incorporar contenido.';detail.append(back,h,p)};menu.append(b)}</script></html>
